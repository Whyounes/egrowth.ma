name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Types, build, and the byte budget. Fast (under a minute) and blocking:
  # if this is red the site is broken or heavier than it is allowed to be.
  # ---------------------------------------------------------------------------
  build:
    name: Check, build, budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run check:budget

      # NON-BLOCKING, and will stay red until the business facts in
      # src/data/site.ts and the legal clauses in src/i18n/*.ts are filled in.
      # It is here so the count is visible on every run, not to gate the build:
      # a required check that is permanently red teaches people to ignore CI.
      # Once the placeholders are gone, drop continue-on-error and fold this
      # into the step above — that is the point at which the site can launch.
      - name: Unfilled content placeholders (informational)
        continue-on-error: true
        run: npm run check:content

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # What the pages DO in a browser, against the thresholds in lighthouserc.cjs.
  # Reuses the artifact above so CI measures exactly the bytes it just checked.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pinned at run time rather than vendored into devDependencies: the lhci
      # tree pulls in ~200 packages (puppeteer, an FTP client) whose advisories
      # would sit in `npm audit` forever for a tool that never runs in prod.
      - name: Lighthouse CI
        run: npm run check:lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
